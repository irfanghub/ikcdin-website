<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IKC DIN Eindhoven — Islamski Kulturni Centar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script>window.IKC_LOGO="logo-icon.png";</script>
<script src="europe-story.js"></script>
<style>
:root {
  --bg: #16261d;
  --surface: #1f3328;
  --card: #283c30;
  --card2: #304538;
  --gold: #c9a84c;
  --gold-light: #e8d07a;
  --gold-dim: rgba(201,168,76,0.13);
  --gold-border: rgba(201,168,76,0.24);
  --green: #2a6040;
  --green-dim: rgba(42,96,64,0.25);
  --neon: #4ade80;
  --neon-soft: rgba(74,222,128,0.55);
  --neon-glow: rgba(74,222,128,0.32);
  --emerald: #10b981;
  --jade: #0fa968;
  --text: #f0ede6;
  --text-muted: #9ab7a3;
  --text-soft: #c4d4c8;
  --radius: 14px;
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'DM Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; overflow-x: hidden; }

/* Islamic geometric tile */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='rgba(201,168,76,0.055)' stroke-width='0.7'%3E%3Cpolygon points='60,4 116,32 116,88 60,116 4,88 4,32'/%3E%3Cpolygon points='60,20 100,42 100,78 60,100 20,78 20,42'/%3E%3Cpolygon points='60,36 84,52 84,68 60,84 36,68 36,52'/%3E%3Cline x1='60' y1='4' x2='60' y2='36'/%3E%3Cline x1='116' y1='32' x2='84' y2='52'/%3E%3Cline x1='116' y1='88' x2='84' y2='68'/%3E%3Cline x1='60' y1='116' x2='60' y2='84'/%3E%3Cline x1='4' y1='88' x2='36' y2='68'/%3E%3Cline x1='4' y1='32' x2='36' y2='52'/%3E%3C/g%3E%3C/svg%3E");
  background-size: 120px 120px;
  opacity: 1;
  background-position: var(--pat-x, 0px) var(--pat-y, 0px);
  transition: background-position 0.2s ease-out;
  will-change: background-position;
}
#root { position: relative; z-index: 1; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 24px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.22s; text-decoration: none; }
.btn-gold { background: var(--gold); color: #080d09; }
.btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(201,168,76,0.3); }
.btn-outline { background: transparent; border: 1.5px solid var(--gold-border); color: var(--text-soft); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-ghost { background: rgba(255,255,255,0.06); color: var(--text-soft); }
.btn-ghost:hover { background: rgba(255,255,255,0.1); }
.btn-green { background: var(--green); color: var(--gold-light); border: 1px solid rgba(201,168,76,0.3); }
.btn-green:hover { background: #357550; }

.section { padding: 100px 0; }
.container { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
.section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.section-title { font-family: var(--font-display); font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 400; line-height: 1.15; color: var(--text); margin-bottom: 16px; }
.section-sub { font-size: 16px; color: var(--text-muted); max-width: 520px; line-height: 1.75; }
.ljiljan-frieze { display:flex; justify-content:center; align-items:center; gap:26px; padding:30px 16px; }
.ljiljan-frieze svg { width:15px; height:19px; color:var(--gold); opacity:0.42; }
.ljiljan-frieze svg:nth-child(even) { width:11px; height:14px; opacity:0.24; }
.divider { width: 56px; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); margin: 18px 0 26px; }
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--gold-border); padding: 28px; }

input, textarea, select { width: 100%; padding: 12px 16px; background: var(--surface); border: 1.5px solid rgba(255,255,255,0.09); border-radius: 8px; color: var(--text); font-family: var(--font-body); font-size: 15px; outline: none; transition: border-color 0.2s; }
input:focus, textarea:focus, select:focus { border-color: var(--gold); }
textarea { resize: vertical; min-height: 80px; }
select { appearance: none; }
label { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }

/* Nav */
nav { position: fixed; top: 52px; left: 0; right: 0; z-index: 500; background: rgba(14,27,20,0.88); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(201,168,76,0.14); }
.nav-inner { max-width: 1160px; margin: 0 auto; padding: 0 32px; height: 70px; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
.nav-logo img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(5,122,65,0.25)); }
.nav-logo-text { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--text); letter-spacing: 0.02em; }
.nav-logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link { font-size: 14px; color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: color 0.2s; cursor: pointer; border: none; background: transparent; font-family: var(--font-body); }
.nav-link { position: relative; }
.nav-link::after { content: ''; position: absolute; bottom: -2px; left: 50%; width: 0; height: 1.5px; background: #4ade80; box-shadow: 0 0 6px #4ade80; border-radius: 2px; transition: width 0.3s ease, left 0.3s ease; }
.nav-link:hover::after, .nav-link.active::after { width: 80%; left: 10%; }
.nav-link:hover { color: var(--gold); }
.nav-link.active { color: var(--gold); background: rgba(201,168,76,0.08); }
.lang-toggle { display: flex; background: var(--card); border-radius: 6px; border: 1px solid var(--gold-border); overflow: hidden; margin: 0 6px; }
.lang-btn { padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); font-family: var(--font-body); transition: all 0.2s; }
.lang-btn.active { background: var(--gold); color: #080d09; }
.mobile-nav { display: none; gap: 8px; align-items: center; }
.hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 36px; height: 36px; background: transparent; border: none; cursor: pointer; padding: 4px; }
.hamburger span { display: block; height: 2px; width: 22px; background: var(--text); border-radius: 2px; transition: all 0.25s; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu { display: none; position: fixed; top: 122px; left: 0; right: 0; background: rgba(10,20,14,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(201,168,76,0.18); z-index: 499; padding: 16px 24px 24px; flex-direction: column; gap: 4px; }
.mobile-menu.open { display: flex; }
.mobile-menu-link { font-size: 16px; color: var(--text-muted); text-decoration: none; padding: 12px 8px; border-radius: 8px; cursor: pointer; background: transparent; border: none; font-family: var(--font-body); text-align: left; transition: color 0.2s, background 0.2s; }
.mobile-menu-link:hover, .mobile-menu-link.active { color: var(--gold); background: rgba(201,168,76,0.08); }
.mobile-menu-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }
.mobile-menu-bottom { display: flex; align-items: center; gap: 10px; padding-top: 4px; }

/* Mosque arch SVG */
.arch-deco { position: absolute; right: 0; top: 0; bottom: 0; width: 520px; pointer-events: none; overflow: hidden; }

/* Hero */
.hero { min-height: 100vh; display: flex; align-items: center; position: relative; overflow: hidden; padding-top: 104px; }
.page-fade > section:first-child:not(.hero), .page-fade > section.story-section:first-child { padding-top: 140px; }
.hero-bg { position: absolute; inset: 0; background-image: url("photo-interior-hires.jpg"); background-size: cover; background-position: center; filter: brightness(0.72) saturate(0.92) contrast(1.03); z-index: 0; }
.hero::before { content: ''; position: absolute; inset: 0; background:
  linear-gradient(100deg, rgba(14,27,20,0.90) 0%, rgba(14,27,20,0.66) 38%, rgba(14,27,20,0.46) 62%, rgba(14,27,20,0.82) 100%);
  z-index: 1; pointer-events: none; }
.hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 60%, rgba(5,122,65,0.22) 0%, transparent 65%), radial-gradient(ellipse at 80% 30%, rgba(201,168,76,0.1) 0%, transparent 55%); pointer-events: none; z-index: 1; }
.hero .container { position: relative; z-index: 5; }
.hero-content { position: relative; z-index: 2; padding: 100px 0 80px; }
.bismillah { font-size: clamp(1.1rem, 2.5vw, 1.8rem); color: rgba(201,168,76,0.55); font-family: var(--font-display); font-style: italic; margin-bottom: 24px; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 100px; padding: 6px 18px; font-size: 13px; color: var(--gold); margin-bottom: 28px; font-weight: 500; }
.hero-salam { font-family: var(--font-display); font-style: italic; font-size: clamp(1.4rem, 3vw, 2.2rem); color: var(--gold-light); margin: 14px 0 6px; letter-spacing: 0.01em; }
.hero-salam::after { content: '·'; display: inline-block; margin-left: 14px; color: var(--gold); opacity: 0.5; }
.hero-title { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 5.8rem); font-weight: 300; line-height: 1.06; color: var(--text); margin-bottom: 8px; }
.hero-title strong { font-weight: 700; color: var(--gold); display: block; }
.hero-sub { font-size: 17px; color: var(--text-muted); max-width: 460px; line-height: 1.75; margin: 20px 0 36px; }
.hero-stats { display: flex; gap: 40px; margin-top: 48px; flex-wrap: wrap; }
.hero-stat-num { font-family: var(--font-display); font-size: 2.8rem; font-weight: 700; color: var(--gold); line-height: 1; }
.hero-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.04em; }

/* Prayer times */
.prayer-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 36px; }
.prayer-card { background: var(--card); border-radius: 12px; border: 1px solid var(--gold-border); padding: 20px 12px; text-align: center; transition: all 0.25s; cursor: default; }
.prayer-card.active { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); border-color: var(--gold); }
.prayer-card.active .p-name, .prayer-card.active .p-alt, .prayer-card.active .p-time { color: #080d09; }
.prayer-card.active .p-label { color: rgba(8,13,9,0.6); }
.p-icon { font-size: 18px; margin-bottom: 8px; }
.p-name { font-size: 13px; font-weight: 600; color: var(--text); }
.p-alt { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.p-time { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; color: var(--gold); margin-top: 8px; }
.p-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; }

/* Hero vaktija panel (gebedstijden — glas-card op de muur/raam, variant G) */
.hero-layout { display: block; }
.hero-content { max-width: 600px; }
.hero-vk { position: absolute; top: 24%; right: max(0px, calc((100% - 1160px)/2 - 40px)); width: 312px; z-index: 6; opacity: 1 !important; animation: none !important; }
.hero-vk .vk-panel { opacity: 1 !important; background: rgba(22,39,29,0.30) !important; }
.vk-panel { background: rgba(22,39,29,0.30); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid var(--gold-border); border-radius: 16px; padding: 13px 14px 11px; box-shadow: 0 24px 60px -24px rgba(0,0,0,0.7); }
.vk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.vk-label { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 7px; }
.vk-date { font-size: 11px; color: var(--text-muted); font-style: italic; text-transform: capitalize; }
.vk-row { display: flex; align-items: center; gap: 12px; padding: 3px 11px; border-radius: 9px; transition: all 0.2s; }
.vk-row + .vk-row { border-top: 1px solid rgba(201,168,76,0.10); }
.vk-row .p-svg { width: 21px; height: 21px; margin: 0; flex-shrink: 0; }
.vk-names { flex: 1; min-width: 0; }
.vk-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.2; }
.vk-alt { font-size: 9px; color: var(--text-muted); margin-top: 0; line-height: 1.2; }
.vk-time { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; color: var(--gold); }
.vk-row.active { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); border-top-color: transparent; }
.vk-row.active .vk-name, .vk-row.active .vk-alt, .vk-row.active .vk-time { color: #080d09; }
.vk-row.active .p-svg { color: #080d09 !important; filter: none !important; }
.vk-now { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: rgba(8,13,9,0.6); text-transform: uppercase; }
.vk-foot { margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(201,168,76,0.12); text-align: center; font-size: 9px; color: var(--text-muted); font-style: italic; }
@media (max-width: 880px) { .hero { flex-direction: column; } .hero-content { max-width: none; } .hero-vk { position: static; width: auto; max-width: 420px; right: auto; top: auto; margin: 28px auto 0; } }

/* Fundraising */
.progress-track { background: rgba(255,255,255,0.07); border-radius: 100px; height: 16px; overflow: hidden; margin: 18px 0 10px; }
.progress-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, #a07a20, var(--gold), var(--gold-light), var(--gold)); background-size: 300% auto; animation: shimmergold 3s linear infinite; transition: width 1.8s cubic-bezier(0.16,1,0.3,1); }
@keyframes shimmergold { 0%{background-position:0% center} 100%{background-position:300% center} }
.fund-amount { font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--gold); line-height: 1; }

/* Mekteb */
.mekteb-section { position: relative; padding: 100px 0 110px; overflow: hidden; }
.mekteb-section::before { content: ''; position: absolute; inset: 0; background:
  radial-gradient(ellipse 60% 50% at 20% 30%, rgba(5,122,65,0.12) 0%, transparent 60%),
  radial-gradient(ellipse 50% 40% at 85% 80%, rgba(201,168,76,0.08) 0%, transparent 60%);
  pointer-events: none; }
.mekteb-header { max-width: 720px; margin-bottom: 56px; }
.mekteb-intro-grid { display: grid; grid-template-columns: 1fr minmax(280px, 360px); gap: 56px; align-items: center; margin-bottom: 64px; }
.mekteb-intro-facts { grid-template-columns: 1fr !important; margin-top: 0 !important; }
.mekteb-showcase { display: grid; grid-template-columns: minmax(420px, 470px) 1fr; gap: 56px; align-items: center; position: relative; z-index: 1; }
.mekteb-phone-wrap { position: relative; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; padding: 20px 0; }
.mekteb-phone-rel { position: relative; flex-shrink: 0; display: inline-block; }
.phone-stack { position: relative; display: flex; align-items: center; justify-content: center; }
.phone-front { position: relative; z-index: 2; }
.phone-shot { width: 100%; height: 100%; object-fit: contain; display: block; }
.phone-hotspot { cursor: pointer; transition: background .18s, box-shadow .18s; }
.phone-hotspot:hover { background: rgba(201,168,76,0.16); box-shadow: inset 0 0 0 1.5px var(--gold); }
.mekteb-tap-hint { width: 100px; flex-shrink: 0; text-align: right; margin: 0; font-size: 13px; font-weight: 500; color: var(--gold-light); letter-spacing: 0.02em; line-height: 1.5; }
.phone-frame { position: relative; width: 290px; height: 590px; background: linear-gradient(140deg, #1a1a1a 0%, #0a0a0a 100%); border-radius: 44px; padding: 12px; box-shadow:
  0 40px 80px -20px rgba(0,0,0,0.7),
  0 30px 50px -25px rgba(5,122,65,0.35),
  inset 0 0 0 1.5px rgba(201,168,76,0.15),
  inset 0 0 0 3px rgba(0,0,0,0.6);
  transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
.phone-front { transform: rotate(-2deg); }
.phone-front:hover { transform: rotate(0deg) translateY(-6px); }
.phone-notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 96px; height: 24px; background: #000; border-radius: 0 0 14px 14px; z-index: 3; }
.phone-notch::after { content: ''; position: absolute; top: 7px; right: 18px; width: 8px; height: 8px; border-radius: 50%; background: rgba(201,168,76,0.4); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,0.8); }
.phone-screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: linear-gradient(165deg, #061310 0%, #0a1f15 45%, #07140e 100%); position: relative; display: flex; flex-direction: column; }
.phone-status { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px 8px; font-size: 10px; font-weight: 600; color: var(--text-soft); }
.phone-status-icons { display: flex; gap: 4px; align-items: center; }
.phone-content { flex: 1; padding: 12px 16px 0; overflow: hidden; }
.phone-greet { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.phone-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #057A41, #0a9c54); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
.phone-greet-text { flex: 1; min-width: 0; }
.phone-greet-hi { font-size: 10px; color: var(--text-muted); }
.phone-greet-name { font-size: 13px; color: var(--text); font-weight: 600; font-family: var(--font-display); }
.phone-bell { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; }
.phone-bell::after { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.phone-hero { background: linear-gradient(135deg, #0d2818 0%, #103a22 50%, #0a2818 100%); border: 1px solid rgba(201,168,76,0.2); border-radius: 16px; padding: 14px; margin-bottom: 14px; position: relative; overflow: hidden; }
.phone-hero::before { content: ''; position: absolute; right: -20px; top: -30px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(5,122,65,0.4) 0%, transparent 70%); }
.phone-hero-label { font-size: 9px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 4px; position: relative; }
.phone-hero-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 2px; position: relative; }
.phone-hero-sub { font-size: 10px; color: var(--text-muted); margin-bottom: 10px; position: relative; }
.phone-hero-arabic { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold-light); text-align: center; padding: 6px 0; opacity: 0.92; position: relative; direction: rtl; }
.phone-progress-wrap { position: relative; margin-bottom: 14px; }
.phone-progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.phone-progress-label { font-size: 10px; color: var(--text-muted); }
.phone-progress-pct { font-size: 12px; color: var(--gold); font-weight: 700; }
.phone-progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden; }
.phone-progress-fill { height: 100%; width: 80%; background: linear-gradient(90deg, #057A41, var(--gold)); border-radius: 100px; box-shadow: 0 0 12px rgba(201,168,76,0.4); }
.phone-section-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px; }
.phone-lesson { display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; margin-bottom: 6px; }
.phone-lesson-day { width: 32px; height: 32px; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--gold); flex-shrink: 0; letter-spacing: 0.05em; }
.phone-lesson-info { flex: 1; min-width: 0; }

}

/* ─────────── Mekteb photo mosaic ─────────── */
.mekteb-mosaic-wrap { position: relative; z-index: 1; margin-top: 96px; }

/* Story strip — Naša priča */

  background:

}

.story-cell::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 30%, rgba(0,0,0,0.78) 100%); pointer-events: none; }

.event-row:hover { border-color: var(--gold); }
.event-date-box { background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 10px; padding: 10px 14px; text-align: center; flex-shrink: 0; min-width: 58px; }
.event-day { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; color: var(--gold); line-height: 1; }
.event-month { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* Contact */
.contact-icon { width: 44px; height: 44px; background: var(--gold-dim); border-radius: 10px; border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.map-frame { width: 100%; height: 400px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--gold-border); }

/* Dashboard */
.modal-overlay { position: fixed; inset: 0; background: rgba(4,8,5,0.9); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--card); border-radius: 20px; border: 1px solid var(--gold-border); width: 100%; max-width: 460px; padding: 40px; position: relative; }
.dash-modal { max-width: 720px; padding: 0; overflow: hidden; }
.dash-tab { padding: 12px 16px; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: var(--font-body); transition: color 0.2s; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.dash-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.dash-tab:not(.active) { color: var(--text-muted); }
.fin-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.fin-row:last-child { border-bottom: none; }
.badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 100px; font-weight: 600; }
.badge-green { background: rgba(42,96,64,0.35); color: #6ecfa0; border: 1px solid rgba(42,96,64,0.5); }
.badge-gold { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold-border); }

/* Islamic section divider */
.star-divider { display: flex; align-items: center; gap: 16px; margin: 0 0 60px; }
.star-divider::before, .star-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-border), transparent); }
.star-glyph { font-size: 20px; color: var(--gold); opacity: 0.7; flex-shrink: 0; }

/* Logo mark used inline as a brand-bullet */
.logo-mark { display: inline-block; vertical-align: middle; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 1px 3px rgba(5,122,65,0.35)); }
.logo-mark-sm { width: 18px; height: 18px; }
.logo-mark-md { width: 22px; height: 22px; }
.logo-mark-lg { width: 32px; height: 32px; }
.logo-mark-xl { width: 38px; height: 38px; opacity: 0.85; }
.section-label .logo-mark { vertical-align: middle; }
.hero-badge .logo-mark { vertical-align: -0.28em; }
.hero-salam .logo-mark { vertical-align: -0.22em; margin-right: 6px; }
.hero-salam::after { display: none; }

/* Footer */
footer { background: #040a05; border-top: 1px solid rgba(201,168,76,0.12); padding: 60px 0 32px; }
.footer-link { display: block; font-size: 14px; color: var(--text-muted); text-decoration: none; margin-bottom: 10px; transition: color 0.2s; cursor: pointer; border: none; background: none; font-family: var(--font-body); text-align: left; }
.footer-link:hover { color: #4ade80; text-shadow: 0 0 8px rgba(74,222,128,0.4); }

/* Animations */
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.fade-up { animation: fadeUp 0.65s ease both; }

/* Scroll reveal */
.reveal { opacity: 0; transform: translateY(48px); transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1); will-change: opacity, transform; }
.reveal.in { opacity: 1; transform: none; }
.reveal-scale { opacity: 0; transform: scale(0.92); transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1); }
.reveal-scale.in { opacity: 1; transform: none; }
.reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1); }
.reveal-left.in { opacity: 1; transform: none; }
.reveal-right { opacity: 0; transform: translateX(40px); transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1); }
.reveal-right.in { opacity: 1; transform: none; }
.stagger > * { transition-delay: calc(var(--i, 0) * 90ms); }

/* Scroll progress bar — top of viewport */
.scroll-progress { position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: linear-gradient(90deg, var(--neon) 0%, var(--jade) 50%, var(--gold) 100%); box-shadow: 0 0 14px var(--neon-glow), 0 0 28px rgba(74,222,128,0.18); z-index: 999; transition: width 0.12s linear; }

/* Ambient particles */
.ambient-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.ambient-particles .pt { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--neon-soft); box-shadow: 0 0 10px var(--neon-glow), 0 0 22px rgba(74,222,128,0.18); animation: drift 22s linear infinite; opacity: 0; }
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) scale(0.6); opacity: 0; }
  10% { opacity: 0.7; }
  85% { opacity: 0.5; }
  100% { transform: translate3d(var(--dx, 80px), -110vh, 0) scale(1.1); opacity: 0; }
}

/* Cursor spotlight — hero only */
.cursor-spotlight { position: absolute; width: 600px; height: 600px; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(74,222,128,0.16) 0%, rgba(74,222,128,0.05) 35%, transparent 65%); mix-blend-mode: screen; transition: opacity 0.4s; z-index: 1; opacity: 0; }
.hero:hover .cursor-spotlight { opacity: 1; }

/* Neon glow utility */
.neon-glow { box-shadow: 0 0 0 1px rgba(74,222,128,0.22), 0 0 24px -4px var(--neon-glow), inset 0 0 0 1px rgba(74,222,128,0.06); }
.neon-edge { position: relative; }
.neon-edge::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, var(--neon-soft), transparent 40%, transparent 60%, var(--gold) 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.5; transition: opacity 0.3s; }
.neon-edge:hover::after { opacity: 1; }

/* Active prayer card pulse + neon */
@keyframes neonPulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(74,222,128,0.55), 0 0 28px -4px var(--neon-glow), 0 0 60px -10px rgba(74,222,128,0.35); }
  50% { box-shadow: 0 0 0 1px rgba(74,222,128,0.85), 0 0 44px -2px rgba(74,222,128,0.55), 0 0 90px -10px rgba(74,222,128,0.5); }
}

/* Parallax hero bg */
.hero-bg { transform: translateY(var(--py, 0px)) scale(1.08); transition: transform 0.05s linear; }

/* Section header animated underline */
.section-title { position: relative; }

/* Prayer icon svg styling */
.p-svg { width: 32px; height: 32px; margin: 0 auto 6px; display: block; color: var(--gold); transition: color 0.3s, filter 0.3s; filter: drop-shadow(0 0 10px rgba(201,168,76,0.25)); }
.prayer-card.active .p-svg { color: #080d09; filter: drop-shadow(0 0 8px rgba(74,222,128,0.4)); }
.prayer-card:hover:not(.active) { border-color: var(--neon-soft); box-shadow: 0 0 0 1px rgba(74,222,128,0.2), 0 12px 28px -10px var(--neon-glow); transform: translateY(-3px); }
.prayer-card { transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s; }
.prayer-card.active { animation: neonPulse 3.4s ease-in-out infinite; }

/* Card hover lift with neon glow on relevant blocks */
.news-card { transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), border-color 0.3s, box-shadow 0.3s; }
.news-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px -16px var(--neon-glow), 0 0 0 1px rgba(74,222,128,0.18); }
.event-row { transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; }
.event-row:hover { transform: translateX(6px); box-shadow: -4px 0 0 var(--neon), 0 8px 24px -12px var(--neon-glow); }

/* Button neon variant + hover */
.btn-gold { position: relative; overflow: hidden; }
.btn-gold::before { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%); transform: translateX(-100%); transition: transform 0.7s; }
.btn-gold:hover::before { transform: translateX(100%); }
.btn-outline:hover { box-shadow: 0 0 0 1px var(--neon-soft), 0 8px 28px -10px var(--neon-glow); border-color: var(--neon-soft); color: var(--neon); }

/* Floating moon orb (hero replacement for mosque) */
.hero-orb { position: absolute; right: -120px; top: 50%; transform: translateY(-50%); width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle at 38% 38%, rgba(74,222,128,0.18) 0%, rgba(42,96,64,0.12) 25%, rgba(6,13,8,0) 60%); pointer-events: none; z-index: 1; filter: blur(6px); animation: orbBreath 8s ease-in-out infinite; }
@keyframes orbBreath { 0%, 100% { transform: translateY(-50%) scale(1); opacity: 0.85; } 50% { transform: translateY(-52%) scale(1.05); opacity: 1; } }
.hero-orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(74,222,128,0.12); animation: ringSpin 32s linear infinite; }
.hero-orb-ring.r2 { inset: 40px; border-color: rgba(201,168,76,0.08); animation-duration: 48s; animation-direction: reverse; }
.hero-orb-ring.r3 { inset: 90px; border-color: rgba(74,222,128,0.18); border-style: dashed; animation-duration: 60s; }
@keyframes ringSpin { to { transform: rotate(360deg); } }

/* Section breathing green ambient */
.section, .mekteb-section, .story-section, .contact-section { position: relative; }

/* Mekteb feature icon — add neon */
.mekteb-feature-row { transition: padding-left 0.3s; }
.mekteb-feature-row:hover { padding-left: 8px; }
@keyframes borderTrace { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
.mekteb-section .section-inner > div[style*="border"] { transition: box-shadow 0.4s; }
.mekteb-section .section-inner > div[style*="border"]:hover { box-shadow: 0 0 0 1.5px #4ade80, 0 0 24px rgba(74,222,128,0.2); }
.mekteb-feature-row:hover .mekteb-feature-icon { box-shadow: 0 0 0 1px var(--neon-soft), 0 0 24px -6px var(--neon-glow); border-color: var(--neon-soft); }
.mekteb-feature-icon { transition: box-shadow 0.3s, border-color 0.3s; }

/* Progress fill — green-tinged */
.progress-fill { background: linear-gradient(90deg, var(--jade), var(--gold), var(--neon), var(--gold-light), var(--jade)); background-size: 300% auto; box-shadow: 0 0 16px rgba(74,222,128,0.22); }

/* Number stat reveal */
.hero-stat-num { transition: text-shadow 0.4s; }
.hero-stat-num:hover { text-shadow: 0 0 24px var(--neon-glow); }

/* Story strip hover green glow */
.story-cell::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(74,222,128,0.18) 100%); opacity: 0; transition: opacity 0.5s; z-index: 1; pointer-events: none; }
.story-cell:hover::before { opacity: 1; }

/* Float badge soft pulse */
.mekteb-float-badge { animation-name: badgeFloat !important; }
@keyframes badgeFloat { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-10px) rotate(var(--rot, 0deg)); } }

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  .ambient-particles, .hero-orb-ring, .hero-orb { animation: none; }
  .reveal, .reveal-scale, .reveal-left, .reveal-right { opacity: 1; transform: none; transition: none; }
}

/* Notification */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--gold-border); border-radius: 12px; padding: 14px 24px; font-size: 14px; color: var(--text); z-index: 2000; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: fadeUp 0.4s ease; }

@media (max-width: 900px) {
  .nav-links { display: none; }
  .mobile-nav { display: flex; }
  .hamburger { display: flex; }
  .prayer-grid { grid-template-columns: repeat(3, 1fr); }
  .mekteb-card { grid-template-columns: 1fr; padding: 32px; }
  .mekteb-showcase { grid-template-columns: 1fr; gap: 60px; }
  .mekteb-phone-wrap { flex-direction: column; }
  .mekteb-phone-rel { order: 1; }
  .mekteb-tap-hint { order: 2; width: auto; text-align: center; margin-top: 18px; }
  .mekteb-phone-wrap { order: 2; }
  .mekteb-features { order: 1; }
  .mekteb-float-badge.b1 { right: 0; }
  .mekteb-float-badge.b2 { left: 0; }
  .arch-deco { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .hero-stats { gap: 24px; }
  .story-strip { grid-template-columns: 1fr; height: auto; }
  .story-cell { height: 320px; }
}
@media (max-width: 600px) {
  .section { padding: 64px 0; }
  .container { padding: 0 20px; }
  .prayer-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ─────────── Lidmaatschap / Usluge ─────────── */
.lid-hero { padding: 130px 0 60px; position: relative; }
.lid-hero::before { content:''; position:absolute; left:50%; top:80px; transform: translateX(-50%); width: 280px; height: 280px; background: radial-gradient(circle, rgba(201,168,76,0.10), transparent 70%); pointer-events: none; }
.lid-head { text-align: center; max-width: 720px; margin: 0 auto; position: relative; }
.lid-head .section-label { justify-content: center; }
.lid-head .divider { margin: 18px auto 26px; }
.lid-head .section-sub { margin: 0 auto; }

.usluge-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 56px; }
.usluge-pillar { background: var(--card); border: 1px solid var(--gold-border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease; }
.usluge-pillar:hover { transform: translateY(-5px); box-shadow: 0 22px 50px rgba(0,0,0,0.35); border-color: rgba(201,168,76,0.5); }
.usluge-pillar-img { height: 210px; background-size: cover; background-position: center; position: relative; }
.usluge-pillar-img::after { content:''; position:absolute; inset:0; background: linear-gradient(0deg, rgba(14,27,20,0.78) 0%, rgba(14,27,20,0.05) 55%, transparent 100%); }
.usluge-pillar-glyph { position: absolute; left: 22px; bottom: 18px; z-index: 2; width: 46px; height: 46px; border-radius: 50%; background: rgba(14,27,20,0.85); border: 1px solid rgba(201,168,76,0.45); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.usluge-pillar-body { padding: 26px 28px 30px; flex: 1; display: flex; flex-direction: column; }
.usluge-pillar-tag { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; font-weight: 600; }
.usluge-pillar-title { font-family: var(--font-display); font-size: 1.55rem; line-height: 1.2; margin-bottom: 10px; color: var(--text); font-weight: 600; }
.usluge-pillar-desc { font-size: 14.5px; color: var(--text-muted); line-height: 1.65; }

.usluge-section { padding: 70px 0 90px; }
.usluge-intro { text-align: center; max-width: 660px; margin: 0 auto; }
.usluge-intro .section-label { justify-content: center; }
.usluge-intro .divider { margin: 18px auto 22px; }
.usluge-intro .section-sub { margin: 0 auto; }
.usluge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-top: 44px; }
.usluge-card { background: var(--card); border: 1px solid var(--gold-border); border-radius: 16px; padding: 28px 28px 30px; display: flex; flex-direction: column; gap: 14px; transition: border-color .25s, transform .25s; }
.usluge-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.usluge-card.featured { background: linear-gradient(160deg, rgba(201,168,76,0.09) 0%, rgba(28,44,35,0.95) 60%); border-color: rgba(201,168,76,0.4); position: relative; }
.usluge-card.featured::before { content: ''; position: absolute; top: 0; left: 28px; right: 28px; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }
.usluge-card-head { display: flex; align-items: center; gap: 14px; }
.usluge-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--gold-dim); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.usluge-card-title { font-family: var(--font-display); font-size: 1.3rem; color: var(--text); font-weight: 600; line-height: 1.25; }
.usluge-card-blurb { font-size: 14px; color: var(--text-muted); line-height: 1.65; }
.usluge-list { list-style: none; display: flex; flex-direction: column; gap: 9px; margin-top: 4px; padding: 0; }
.usluge-list li { font-size: 14px; color: var(--text-soft); line-height: 1.5; padding-left: 18px; position: relative; }
.usluge-list li::before { content: '◆'; position: absolute; left: 0; color: var(--gold); font-size: 8px; top: 6px; }
.usluge-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 100px; font-size: 11px; color: var(--gold-light); font-weight: 500; letter-spacing: 0.06em; }

.benefits-section { padding: 80px 0; background: linear-gradient(180deg, rgba(14,27,20,0.4), rgba(22,36,28,0.92)); border-top: 1px solid rgba(201,168,76,0.13); border-bottom: 1px solid rgba(201,168,76,0.13); }
.benefits-intro { text-align: center; max-width: 620px; margin: 0 auto; }
.benefits-intro .section-label { justify-content: center; }
.benefits-intro .divider { margin: 18px auto 22px; }
.benefits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 36px; }
.benefit-item { display: flex; gap: 14px; padding: 18px 20px; background: rgba(28,44,35,0.6); border-radius: 12px; border: 1px solid rgba(201,168,76,0.12); transition: border-color .2s, background .2s; }
.benefit-item:hover { border-color: rgba(201,168,76,0.35); background: rgba(28,44,35,0.85); }
.benefit-check { width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: var(--gold-light); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.benefit-text { font-size: 14.5px; color: var(--text-soft); line-height: 1.55; padding-top: 4px; }

@media (max-width: 960px) {
  .usluge-pillars { grid-template-columns: 1fr; }
  .usluge-grid { grid-template-columns: 1fr; }
  .benefits-grid { grid-template-columns: 1fr; }
  .lid-hero { padding: 110px 0 40px; }
}

/* ─────────── Lidmaatschap OPTIE 2 — levensdomeinen ─────────── */
.o2-hero { padding: 100px 0 50px; text-align: center; position: relative; }
.o2-hero::before { content:''; position:absolute; left:50%; top:90px; transform: translateX(-50%); width: 300px; height: 300px; background: radial-gradient(circle, rgba(201,168,76,0.10), transparent 70%); pointer-events: none; }
.o2-hero .section-label { justify-content: center; }
.o2-hero .lid-price-pill { display: inline-flex; }
.o2-toc { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
.o2-toc a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 100px; border: 1px solid var(--gold-border); background: var(--card); color: var(--text-soft); font-size: 13px; text-decoration: none; transition: all .2s; }
.o2-toc a:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
.o2-domain { padding: 64px 0; border-top: 1px solid rgba(201,168,76,0.1); }
.o2-domain:nth-child(even) { background: rgba(22,36,28,0.4); }
.o2-dom-grid { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 54px; align-items: center; }
.o2-domain.flip .o2-dom-grid { grid-template-columns: 1.08fr 0.92fr; }
.o2-domain.flip .o2-dom-text { order: 2; }
.o2-dom-icon { width: 58px; height: 58px; border-radius: 15px; background: var(--gold-dim); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 18px; }
.o2-dom-text h2 { font-family: var(--font-display); font-size: clamp(1.8rem,3vw,2.5rem); font-weight: 600; color: var(--text); line-height: 1.12; margin-bottom: 14px; }
.o2-dom-blurb { font-size: 15.5px; color: var(--text-muted); line-height: 1.7; margin-bottom: 22px; }
.o2-dom-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; padding: 0; }
.o2-dom-list li { font-size: 14px; color: var(--text-soft); padding-left: 18px; position: relative; line-height: 1.5; list-style: none; }
.o2-dom-list li::before { content:'◆'; position:absolute; left:0; top:6px; color: var(--gold); font-size: 8px; }
.o2-collage { display: grid; gap: 10px; }
.o2-collage.vjera   { grid-template-columns: 1.5fr 1fr 1fr; grid-template-rows: 158px 158px; }
.o2-collage.vjera .o2-collage-item:nth-child(1) { grid-row: span 2; }
.o2-collage.mekteb  { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 150px 150px; }
.o2-collage.mekteb .o2-collage-item:nth-child(1) { grid-column: span 2; }
.o2-collage.kultura { grid-template-columns: 1fr 1fr; grid-template-rows: 155px 155px; }
.o2-collage.prostor { grid-template-columns: 1fr 1fr; grid-template-rows: 155px 155px; }
.o2-iconstrip { display: flex; flex-wrap: wrap; gap: 9px; margin: 0 0 22px; }
.o2-iconstrip-item { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 100px; background: var(--gold-dim); border: 1px solid var(--gold-border); }
.o2-iconstrip-emoji { font-size: 15px; line-height: 1; }
.o2-iconstrip-label { font-size: 11.5px; color: var(--gold-light); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
.o2-collage-item { border-radius: 14px; overflow: hidden; position: relative; background-size: cover; background-position: center; background-color: var(--card); border: 1px solid rgba(201,168,76,0.18); transition: transform .3s ease, box-shadow .3s ease; }
.o2-collage-item:hover { transform: scale(1.015); box-shadow: 0 16px 36px rgba(0,0,0,0.4); }
.o2-collage-item::after { content:''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(14,27,20,0) 38%, rgba(14,27,20,0.62) 100%); }
.o2-collage-label { position: absolute; left: 14px; bottom: 12px; z-index: 2; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold-light); font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
.o2-dom-textfull { max-width: 760px; margin: 0 auto; text-align: center; }
.o2-dom-textfull .o2-dom-icon { margin: 0 auto 18px; }
.o2-dom-textfull h2 { font-family: var(--font-display); font-size: clamp(1.8rem,3vw,2.5rem); font-weight: 600; color: var(--text); line-height: 1.12; margin-bottom: 14px; }
.o2-dom-textfull .o2-dom-list { max-width: 640px; margin: 22px auto 0; text-align: left; }
@media (max-width: 900px) {
  .o2-hero { padding: 110px 0 40px; }
  .o2-dom-grid, .o2-domain.flip .o2-dom-grid { grid-template-columns: 1fr; gap: 30px; }
  .o2-domain.flip .o2-dom-text { order: 0; }
  .o2-dom-list, .o2-dom-textfull .o2-dom-list { grid-template-columns: 1fr; }
}

/* ─────────── Lidmaatschap photo collage ─────────── */
.lid-collage {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
  grid-template-rows: 200px 200px;
  gap: 12px;
  margin-top: 56px;
}
.lid-collage-item {
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  background-size: cover;
  background-position: center;
  background-color: var(--card);
  border: 1px solid rgba(201,168,76,0.18);
  transition: transform .3s ease, box-shadow .3s ease;
}
.lid-collage-item:hover { transform: scale(1.015); box-shadow: 0 16px 36px rgba(0,0,0,0.35); }
.lid-collage-item.big { grid-column: span 1; grid-row: span 2; }
.lid-collage-item.tall { grid-row: span 2; }
.lid-collage-item::after {
  content:''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(14,27,20,0) 40%, rgba(14,27,20,0.55) 100%);
}
.lid-collage-label {
  position: absolute; left: 16px; bottom: 14px; z-index: 2;
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold-light); font-weight: 600;
  text-shadow: 0 2px 6px rgba(0,0,0,0.9);
}
.lid-price-pill {
  display: inline-flex; align-items: center; gap: 12px;
  margin-top: 22px; padding: 10px 22px;
  background: rgba(201,168,76,0.12); border: 1px solid var(--gold-border);
  border-radius: 100px; font-size: 14px; color: var(--gold-light);
  white-space: nowrap;
}
.lid-price-pill .lid-price-amt { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--gold); white-space: nowrap; }
.lid-price-pill .lid-price-divider { width: 1px; height: 20px; background: rgba(201,168,76,0.4); }

@media (max-width: 960px) {
  .lid-collage { grid-template-columns: 1fr 1fr; grid-template-rows: 160px 160px 160px 160px; }
  .lid-collage-item.big { grid-column: span 2; grid-row: span 2; }
  .lid-collage-item.tall { grid-row: span 1; }
}

/* ─────────── Story detail modal ─────────── */
.story-cell { cursor: pointer; transition: transform .3s ease; }
.story-cell:hover { transform: translateY(-3px); }
.story-cell:hover .story-cell-readmore { color: var(--gold); }
.story-cell-readmore {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px; font-size: 12.5px; color: var(--gold-light);
  letter-spacing: 0.05em; font-weight: 500;
}

.story-modal-backdrop {
  position: fixed; inset: 0; background: rgba(8,16,11,0.78);
  backdrop-filter: blur(10px); z-index: 900;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.story-modal {
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: 22px;
  max-width: 880px; width: 100%; max-height: 92vh;
  display: grid; grid-template-columns: 320px 1fr;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: modalIn .35s cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: none; } }
.story-modal-img {
  background-size: cover; background-position: center;
  position: relative; min-height: 280px;
}
.story-modal-img::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(14,27,20,0.0) 0%, rgba(14,27,20,0.5) 100%);
}
.story-modal-body { padding: 44px 44px 40px; overflow-y: auto; }
.story-modal-step {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold); font-weight: 600; margin-bottom: 12px;
}
.story-modal-title {
  font-family: var(--font-display);
  font-size: 2rem; line-height: 1.15; color: var(--text);
  margin-bottom: 18px; font-weight: 600;
}
.story-modal-lead {
  font-size: 16px; color: var(--gold-light);
  line-height: 1.65; margin-bottom: 18px;
  font-family: var(--font-display); font-style: italic; font-weight: 400;
}
.story-modal-body p { font-size: 14.5px; color: var(--text-soft); line-height: 1.75; margin-bottom: 14px; }
.story-modal-quote {
  border-left: 3px solid var(--gold);
  padding: 12px 0 12px 20px; margin: 22px 0 8px;
  font-family: var(--font-display); font-size: 18px; font-style: italic;
  color: var(--gold-light); line-height: 1.5;
}
.story-modal-activities { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.story-modal-activity { font-size: 13px; color: var(--text-soft); padding-left: 14px; position: relative; line-height: 1.5; }
.story-modal-activity::before { content: '◆'; position: absolute; left: 0; color: var(--gold); font-size: 7px; top: 7px; }
.story-modal-close {
  position: absolute; top: 16px; right: 16px; z-index: 3;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(14,27,20,0.78); border: 1px solid rgba(201,168,76,0.32);
  color: var(--gold-light); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.story-modal-close:hover { background: var(--gold); color: #080d09; transform: rotate(90deg); }

@media (max-width: 760px) {
  .story-modal { grid-template-columns: 1fr; max-height: 96vh; }
  .story-modal-img { min-height: 200px; }
  .story-modal-body { padding: 28px; }
  .story-modal-title { font-size: 1.55rem; }
  .story-modal-activities { grid-template-columns: 1fr; }
}

  font-size: 15px; color: var(--text-soft); letter-spacing: 0.01em;

/* Anim 1 — Levende vaktija: ademende actieve rij + live afteller */
@keyframes vkBreathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.0); border-top-color: transparent; }
  50% { box-shadow: 0 0 18px 2px rgba(74,222,128,0.3); }
}
.vk-row.active { animation: vkBreathe 3.2s ease-in-out infinite; }
.vk-countdown {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
  color: rgba(8,13,9,0.72); margin-top: 2px; font-variant-numeric: tabular-nums;
}

/* Anim 2 — Bismillah onthulling (mask-wipe, behoudt ligaturen) */
.bismillah.reveal-write {
  -webkit-mask-image: linear-gradient(90deg, #000 0 0);
  mask-image: linear-gradient(90deg, #000 0 0);
}
@media (prefers-reduced-motion: no-preference) {
  .bismillah.reveal-write {
    -webkit-mask-image: linear-gradient(-90deg, #000 35%, transparent 62%);
    mask-image: linear-gradient(-90deg, #000 35%, transparent 62%);
    -webkit-mask-size: 280% 100%; mask-size: 280% 100%;
    -webkit-mask-position: 100% 0; mask-position: 100% 0;
    animation: bismWrite 2.1s cubic-bezier(0.5,0,0.2,1) 0.35s forwards;
    opacity: 0.999;
  }
}
@keyframes bismWrite {
  from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
  to   { -webkit-mask-position: 0% 0;   mask-position: 0% 0; }
}

/* Anim 5 — story route draws itself (handled with JS draw, settle to dashed) */
.story-map.drawing .story-route-line { stroke-dasharray: var(--rl) ; }

/* Anim 7 — zachte paginaovergang */
@keyframes pageIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: no-preference) {
  .page-fade { animation: pageIn 0.5s cubic-bezier(0.16,1,0.3,1); }
}
