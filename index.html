          </div>
          <div className="nl-mc-pill" title="Auto-sync via Mailchimp RSS">
            <span className="nl-mc-dot"></span>
            {t.nl_live}
          </div>
        </div>

        <div className="nl-grid stagger">
          {NEWSLETTERS.map((n, i) => (
            <a
              key={n.id}
              className="nl-card reveal"
              href={n.url}
              target={n.flyer ? undefined : '_blank'}
              rel="noopener noreferrer"
              onClick={n.flyer ? (e => { e.preventDefault(); setFlyer(n); }) : undefined}
              style={{ '--i': i, cursor: 'pointer' }}
            >
              <div className={`nl-card-cover${n.cover_img ? ' has-img' : ''}`}>
                {n.cover_img && <img className="nl-cover-img" src={n.cover_img} alt={lang==='nl'?n.subject_nl:n.subject_bs}/>}
                {n.cover_img && <div className="nl-cover-grad"></div>}
                <span className="nl-cover-edition">{n.edition}</span>
                {n.cover_img
                  ? <span className="nl-cover-cta">📄 {lang==='nl'?'Bekijk de flyer':'Pogledaj letak'}</span>
                  : <span className="nl-cover-glyph">{n.cover_glyph}</span>}
              </div>
              <div className="nl-card-body">
                <div className="nl-meta">
                  <span>{fmtDate(n.sent_iso)}</span>
                  <span className="nl-meta-dot"></span>
                  <span>{ago(n.sent_ago_days)}</span>
                </div>
                <div className="nl-title">{lang === 'nl' ? n.subject_nl : n.subject_bs}</div>
                <div className="nl-snippet">{lang === 'nl' ? n.snippet_nl : n.snippet_bs}</div>
              </div>
              <div className="nl-card-foot">
                <div className="nl-tags">
                  {(lang === 'nl' ? n.tags_nl : n.tags_bs).map((tag, j) => (
                    <span key={j} className="nl-tag">{tag}</span>

                <span className="nl-open">{n.flyer ? (lang==='nl'?'Bekijk flyer':'Pogledaj letak') : t.nl_open} →</span>
              </div>

        <div className="nl-foot">

          <form

// ── SCROLL PROGRESS ──
function ScrollProgress() {
  const ref = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      if (ref.current) ref.current.style.width = pct + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-progress" ref={ref}></div>;
}

// ── AMBIENT FLOATING PARTICLES ──
function AmbientParticles({ count = 14 }) {
  const dots = Array.from({ length: count }, (_, i) => {
    const left = (i * 7.3 + 4) % 100;
    const delay = (i * 1.4) % 22;
    const dx = (i % 2 === 0 ? 60 : -60) + ((i * 13) % 50);
    const size = 1.5 + (i % 3) * 0.8;
    return { left, delay, dx, size, i };
  });
  return (
    <div className="ambient-particles" aria-hidden="true">
      {dots.map(d => (
        <span key={d.i} className="pt" style={{
          left: d.left + '%',
          bottom: '-10px',
          width: d.size + 'px',
          height: d.size + 'px',
          animationDelay: '-' + d.delay + 's',
          '--dx': d.dx + 'px',
        }}/>
      ))}
    </div>
  );
}

// ── v10 HELPERS: count-up + live next-prayer ──
function CountUp({ value, prefix = '', suffix = '', dur = 1500 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.textContent = prefix + value + suffix; return; }
    let raf, started = false;
    const run = () => {
      const t0 = performance.now();
      const tick = t => {
        const p = Math.min((t - t0) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = prefix + Math.round(e * value) + suffix;
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    const io = new IntersectionObserver(([en]) => {
      if (en.isIntersecting && !started) { started = true; run(); io.disconnect(); }
    }, { threshold: 0.4 });
    io.observe(el);
    return () => { cancelAnimationFrame(raf); io.disconnect(); };
  }, [value]);
  return <span ref={ref}>{prefix + '0' + suffix}</span>;
}

// next-prayer index (skips sunrise idx 1) + seconds remaining
function getNextPrayer(times, now) {
  const order = [0, 2, 3, 4, 5];
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const toSec = s => { const [h, m] = s.split(':').map(Number); return h * 3600 + m * 60; };
  for (const i of order) {
    if (times[i] && toSec(times[i]) > nowSec) return { idx: i, remain: toSec(times[i]) - nowSec };
  }
  // none left today → next is Fajr tomorrow
  const remain = (24 * 3600 - nowSec) + (times[0] ? toSec(times[0]) : 0);
  return { idx: 0, remain };
}
function fmtCountdown(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
              : `${m}:${String(s).padStart(2,'0')}`;
}

// Idea 2 — slanke "volgend gebed" balk bovenaan, altijd zichtbaar
function NextPrayerBar({ lang }) {
  const t = T[lang];
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const times = calcPrayerTimes(now);
  const { idx, remain } = getNextPrayer(times, now);
  const name = (t.pnames[idx] || ['',''])[0];
  return (
    <div className="next-prayer-bar">
      <span className="npb-moon"><PrayerIcon idx={idx} className="npb-icon-svg"/></span>
      <span className="npb-label">{lang === 'nl' ? 'Volgend gebed' : 'Sljedeći namaz'}</span>
      <span className="npb-name">{name}</span><span className="npb-om" style={{color:'var(--text-muted)',fontSize:'15px'}}>{lang==='bs' ? 'u' : 'om'}</span><span className="npb-prayer-time" style={{color:'var(--gold)',fontWeight:'600',fontSize:'16px'}}>{times[idx] || '--:--'}</span>
      <span className="npb-prefix" style={{color:'var(--text-muted)',fontSize:'15px'}}>{lang==='bs' ? 'još' : 'nog'}</span><span className="npb-count">{fmtCountdown(remain)}</span><span className="npb-suffix" style={{color:'var(--text-muted)',fontSize:'15px'}}>{lang==='bs' ? '' : 'te gaan'}</span>
      <span className="npb-sep"/>
      <span className="npb-place">{`Eindhoven ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`}</span>
    </div>
  );
}

// ── REVEAL OBSERVER ──
function useRevealObserver() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal, .reveal-scale, .reveal-left, .reveal-right');
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });
}

function HadithRotator({ lang }) {
  const list = lang === 'nl' ? HADITHS_NL : HADITHS_BS;
  const [idx, setIdx] = React.useState(0);
  const [visible, setVisible] = React.useState(true);
  React.useEffect(() => {
    const t = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setIdx(i => (i + 1) % list.length); setVisible(true); }, 600);
    }, 6000);
    return () => clearInterval(t);
  }, [list.length]);
  return (
    <div style={{borderTop:'1px solid rgba(201,168,76,0.1)',borderBottom:'1px solid rgba(201,168,76,0.1)',background:'rgba(10,18,12,0.6)',padding:'28px 0',textAlign:'center'}}>
      <div className="container" style={{maxWidth:640}}>
        <div style={{fontSize:11,letterSpacing:'0.18em',textTransform:'uppercase',color:'rgba(201,168,76,0.5)',marginBottom:14}}>
          {lang==='nl'?'Hadith':'Hadis'}
        </div>
        <div style={{transition:'opacity 0.6s',opacity:visible?1:0,minHeight:64}}>
          <p style={{fontFamily:'var(--font-display)',fontSize:'clamp(1rem,2.2vw,1.2rem)',fontWeight:300,color:'var(--text-soft)',lineHeight:1.6,fontStyle:'italic',margin:'0 0 10px'}}>
            {list[idx].text}
          </p>
          <span style={{fontSize:11,color:'rgba(201,168,76,0.5)',letterSpacing:'0.1em'}}>{list[idx].src}</span>
        </div>
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────
function App() {
  const [lang,setLang]=useState(()=>localStorage.getItem('ikc-lang')||'nl');
  const [page,setPage]=useState(()=>localStorage.getItem('ikc-page')||'home');
  const [showLogin,setShowLogin]=useState(false);
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('ikc-user')||'null')}catch{return null}});
  const [showDash,setShowDash]=useState(false);
  const [raised,setRaised]=useState(()=>parseInt(localStorage.getItem('ikc-raised')||'225000'));

  useEffect(()=>{localStorage.setItem('ikc-lang',lang)},[lang]);
  useEffect(()=>{localStorage.setItem('ikc-page',page)},[page]);
  useRevealObserver();

  // Anim 10 — subtiele geometrische parallax op het achtergrondpatroon
  useEffect(()=>{
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let x=0,y=0,sy=0;
    const apply=()=>{ document.body.style.setProperty('--pat-x',(x).toFixed(1)+'px'); document.body.style.setProperty('--pat-y',(y+sy).toFixed(1)+'px'); };
    const onScroll=()=>{ sy = window.scrollY * -0.06; apply(); };
    const onMove=e=>{ x=(e.clientX/window.innerWidth-0.5)*-14; y=(e.clientY/window.innerHeight-0.5)*-14; apply(); };
    window.addEventListener('scroll',onScroll,{passive:true});
    window.addEventListener('mousemove',onMove,{passive:true});
    return ()=>{ window.removeEventListener('scroll',onScroll); window.removeEventListener('mousemove',onMove); };
  },[]);

  const handleLogin=u=>{setUser(u);localStorage.setItem('ikc-user',JSON.stringify(u));setShowLogin(false);setShowDash(true)};
  const handleLogout=()=>{setUser(null);localStorage.removeItem('ikc-user');setShowDash(false)};

  return (
    <>
      <ScrollProgress/>
      <NextPrayerBar lang={lang}/>
      <AmbientParticles count={16}/>
      <Nav lang={lang} setLang={setLang} onLogin={()=>setShowLogin(true)} loggedIn={!!user} user={user} onLogout={handleLogout} page={page} setPage={setPage}/>
      {user&&!showDash&&(
        <div style={{position:'fixed',bottom:24,right:24,zIndex:400}}>
          <button className="btn btn-gold" style={{boxShadow:'0 8px 32px rgba(201,168,76,0.3)',padding:'12px 20px'}} onClick={()=>setShowDash(true)}>
            👤 {lang==='nl'?'Mijn portaal':'Moj portal'}
          </button>
        </div>
      )}

      <div className="page-fade" key={page}>
      {page==='home' && (
        <>
          <Hero lang={lang} setPage={setPage}/>
          <HadithRotator lang={lang}/>
          <NewsEvents lang={lang}/>
          <NewsletterFeed lang={lang}/>
        </>
      )}
      {page==='verhaal' && <NasaPrica lang={lang}/>}
      {page==='mekteb' && <Mekteb lang={lang}/>}
      {page==='inzameling' && <Fundraising lang={lang} raisedOverride={raised}/>}
      {page==='aanmelden' && <Lidmaatschap lang={lang}/>}
      {page==='contact' && <Contact lang={lang}/>}
      </div>

      <Footer lang={lang} onLogin={()=>setShowLogin(true)} setPage={setPage}/>
      {showLogin&&<LoginModal lang={lang} onClose={()=>setShowLogin(false)} onLogin={handleLogin}/>}
      {showDash&&user&&<Dashboard lang={lang} user={user} onClose={()=>setShowDash(false)} onRaisedChange={setRaised}/>}
    </>
  );
}
