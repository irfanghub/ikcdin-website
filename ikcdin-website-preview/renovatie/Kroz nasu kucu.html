<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kroz vrijeme, kroz Allahovu kuću — Voor &amp; Na</title>
<link rel="stylesheet" href="shared.css"/>
<script src="photos.js"></script>
<style>
/* ====== Kroz našu kuću — full-photo voor/na schuif ====== */

/* ---- 8-punts ster (keystone) ---- */
.star{position:relative;display:inline-block;width:18px;height:18px;}
.star i,.star i::after{content:'';position:absolute;inset:0;background:var(--gold);border-radius:2px;}
.star i::after{transform:rotate(45deg);}

/* ---- Hero ---- */
.hero{position:relative;min-height:78vh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:120px 24px 70px;}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg .hb{position:absolute;top:0;bottom:0;width:52%;overflow:hidden;}
.hero-bg .hb img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-bg .hb.l{left:0;clip-path:polygon(0 0,100% 0,calc(100% - 120px) 100%,0 100%);}
.hero-bg .hb.l img{filter:saturate(0.45) brightness(0.5) contrast(1.04);}
.hero-bg .hb.r{right:0;}
.hero-bg .hb.r img{filter:brightness(0.58) saturate(1.04);}
.hero-seam{position:absolute;top:-6%;bottom:-6%;left:50%;width:2px;transform:translateX(-50%) rotate(7deg);background:linear-gradient(180deg,transparent,rgba(232,208,122,0.85),transparent);box-shadow:0 0 22px rgba(201,168,76,0.55);z-index:1;}
.hero-scrim{position:absolute;inset:0;z-index:2;background:
  radial-gradient(ellipse 72% 92% at 50% 50%,rgba(3,7,10,0.9),rgba(3,7,10,0.55) 52%,rgba(3,7,10,0.35) 78%),
  linear-gradient(180deg,rgba(3,7,10,0.55),rgba(3,7,10,0.25) 38%,rgba(3,7,10,0.7));}
.hero-arch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;height:560px;max-width:88vw;border:1.4px solid var(--gold-border);border-radius:50% 50% 16px 16px/30% 30% 16px 16px;box-shadow:inset 0 0 90px rgba(201,168,76,0.06),0 0 60px rgba(201,168,76,0.05);z-index:3;pointer-events:none;}
.hero-key{position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:5;width:52px;height:auto;animation:hkpulse 3.4s ease-in-out infinite;}
.hero-key svg{display:block;width:100%;height:auto;overflow:visible;}
.hero-key .hk-moon{fill:#f3e3a6;}
.hero-key .hk-star{fill:#fff6da;}
@keyframes hkpulse{0%,100%{filter:drop-shadow(0 0 6px rgba(232,208,122,0.9)) drop-shadow(0 0 15px rgba(201,168,76,0.55)) drop-shadow(0 0 26px rgba(74,222,128,0.18));}50%{filter:drop-shadow(0 0 11px rgba(232,208,122,1)) drop-shadow(0 0 26px rgba(201,168,76,0.8)) drop-shadow(0 0 44px rgba(74,222,128,0.3));}}
@media (prefers-reduced-motion: reduce){.hero-key{animation:none;filter:drop-shadow(0 0 9px rgba(232,208,122,0.95)) drop-shadow(0 0 20px rgba(201,168,76,0.6));}}
.hero-inner{position:relative;z-index:4;max-width:660px;}
.hero-inner .eyebrow{display:block;margin-bottom:18px;}
.hero-inner h1{font-family:var(--font-display);font-weight:300;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.04;margin:0 0 34px;}
.hero-inner h1 .bos{display:block;font-weight:700;color:var(--gold);}
.hero-inner p{color:var(--text-soft);max-width:520px;margin:20px auto 26px;font-size:1.05rem;line-height:1.6;}
.hero-inner .legend{justify-content:center;margin-top:24px;}
.hero-tag{position:absolute;z-index:4;bottom:26px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;padding:6px 13px;border-radius:100px;background:rgba(6,13,8,0.6);backdrop-filter:blur(6px);}
.hero-tag.l{left:26px;color:var(--voor);border:1px solid rgba(109,127,134,0.5);}
.hero-tag.r{right:26px;color:var(--gold-light);border:1px solid var(--gold-border);}
.scroll-cue{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-top:30px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);}
.scroll-cue::after{content:'';width:1px;height:34px;background:linear-gradient(180deg,var(--gold),transparent);animation:cue 2s ease-in-out infinite;}
@keyframes cue{0%,100%{opacity:.3;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1)}}

/* ---- Stops — doorlopende voor/na muur ---- */
.stops{max-width:none;margin:0;padding:70px 0 0;}

.stop{position:relative;margin:0 0 30px;}
/* logo + cijfer + tekst staan in de ruimte bóven elke rij */
.stop-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:6px 24px 20px;}
.stop-logo{width:44px;height:44px;object-fit:contain;display:block;margin-bottom:4px;filter:drop-shadow(0 2px 10px rgba(5,122,65,0.4));}
.stop-num{font-family:var(--font-display);font-size:clamp(1.9rem,4vw,2.7rem);font-weight:700;line-height:1;color:var(--gold);opacity:0.92;}
.stop-titles{max-width:760px;}
.stop-title{font-family:var(--font-display);font-size:clamp(1.3rem,2.6vw,1.85rem);font-weight:600;line-height:1.12;}
.stop-title .bos{color:var(--text-muted);font-style:italic;font-weight:400;font-size:0.74em;}
.stop-text{color:var(--text-muted);font-size:14px;line-height:1.55;max-width:620px;margin-top:4px;}

/* ---- Voor/Na — twee foto's naadloos naast elkaar, schone beelden ---- */
.duo{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;}
.duo-side{position:relative;aspect-ratio:3/2;overflow:hidden;}
.duo-side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2;}
.duo-side.voor img{filter:saturate(0.5) brightness(0.7) contrast(1.04);}
.duo-side.na img{filter:brightness(0.96) saturate(1.05);}
.duo-side .ph{border-radius:0;}
.duo-badge{position:absolute;bottom:14px;z-index:5;white-space:nowrap;font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;padding:5px 12px;border-radius:100px;background:rgba(3,7,10,0.62);backdrop-filter:blur(5px);}
.duo-side.voor .duo-badge{left:14px;color:#cdd6da;border:1px solid rgba(109,127,134,0.6);}
.duo-side.na .duo-badge{right:14px;color:var(--gold-light);border:1px solid var(--gold-border);}
.duo-cap{position:absolute;left:16px;right:16px;bottom:44px;z-index:5;font-family:var(--font-body);font-size:13px;color:#fff;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,0.9),0 2px 14px rgba(0,0,0,0.8);}
.duo-side.na .duo-cap{text-align:right;}

/* ---- Zachte, lichte vervaging op de verticale naad tussen voor/na ---- */
.duo-blend{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:86px;z-index:4;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%,#000 62%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 38%,#000 62%,transparent 100%);}

/* Logo op de naad — absoluut, neemt GEEN grid-cel in (anders valt 'na' naar een tweede rij) */
.seam-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;width:60px;height:60px;}
.seam-logo svg,.seam-logo img{width:100%;height:100%;object-fit:contain;overflow:visible;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.6));}
.seam-logo .hk-moon{fill:#f3e3a6;}
.seam-logo .hk-star{fill:#fff6da;}

/* Maansikkel+ster als stop-markering (i.p.v. cijfer) */
.stop-logo-mark{display:block;height:clamp(40px,4.6vw,52px);width:auto;margin-bottom:6px;}
.stop-logo-mark svg{height:100%;width:auto;display:block;overflow:visible;filter:drop-shadow(0 2px 10px rgba(5,122,65,0.4));}
.stop-logo-mark .hk-moon{fill:var(--gold);}
.stop-logo-mark .hk-star{fill:var(--gold-light);}

/* twee voor/na-rijen binnen één stop (bv. Divanhana) */
.stop .duo + .duo{margin-top:6px;}

/* ---- Finale ---- */
.finale{position:relative;min-height:96vh;display:flex;align-items:flex-end;overflow:hidden;}
.finale-img{position:absolute;inset:0;}
.finale-img img{width:100%;height:100%;object-fit:cover;display:block;}
.finale::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,7,10,0.5) 0%,transparent 28%,rgba(3,7,10,0.62) 62%,rgba(3,7,10,0.97) 100%);}
.finale-inner{position:relative;z-index:2;width:100%;padding:0 6vw 20px;display:flex;flex-direction:column;align-items:center;min-height:80vh;}
.finale-cap{max-width:740px;margin-bottom:28px;align-self:flex-start;}
.finale-cap .eyebrow{display:block;margin-bottom:12px;}
.finale-cap h2{font-family:var(--font-display);font-weight:300;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.04;}
.finale-cap h2 b{color:var(--gold-light);font-weight:700;}
.finale-cap p{color:var(--text-soft);font-size:1.1rem;margin-top:14px;max-width:540px;text-shadow:0 1px 12px rgba(0,0,0,0.6);}
.finale-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:900px;margin:auto auto 0;}
.finale-grid figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--gold-border);box-shadow:0 18px 44px rgba(0,0,0,0.55);filter:brightness(0.65) saturate(0.6);}
.finale-grid img{width:100%;height:100%;object-fit:cover;display:block;}
.finale-grid figcaption{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 11px 9px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-soft);background:linear-gradient(180deg,transparent,rgba(3,7,10,0.88));}

/* ---- Coda ---- */
.coda{text-align:center;padding:80px 24px 120px;max-width:640px;margin:0 auto;}
.coda .bismi{font-size:1.2rem;display:block;margin-bottom:12px;}
.coda p{color:var(--text-soft);font-family:var(--font-display);font-size:1.5rem;font-style:italic;line-height:1.4;}

@media (max-width:760px){
  .hero-bg .hb{width:58%;}
  .duo{grid-template-columns:1fr;}
  .stop{margin-bottom:24px;}
  .finale-grid{grid-template-columns:repeat(2,1fr);}
}

.ljiljan-frieze{display:flex;justify-content:center;align-items:center;gap:26px;padding:46px 16px 10px;position:relative;z-index:2;}
.ljiljan-frieze svg{width:15px;height:19px;color:var(--gold);opacity:0.42;}
.ljiljan-frieze svg:nth-child(even){width:11px;height:14px;opacity:0.24;}
</style>
</head>

<!-- CODA -->
<div class="coda tile-pattern">
  <span class="bismi">Rabbenā taqabbel minnā</span>
  <p>"Naš Gospodaru, primi ovo od nas." — kuća sagrađena rukama zajednice.</p>
</div>

<script>
const STOPS = [
  { title:'Pročelje &amp; ulaz', bos:'gevel & entree', text:'Prazan, oronuo prostor na Hugo de Grootpleinu. Zatvoren, hladan, tih — ali pun obećanja. Ovdje će nastati naša bosanska kuća.',
    rows:[ {voor:1, na:'exterieur', vcap:'Oronulo pročelje', ncap:'Naš ulaz na trgu'} ] },
  { title:'Mesdžid', bos:'gebedshal', text:'Mesdžid kao goli kostur: oguljeni zidovi, izvađeni podovi, sve do temelja. Težak rad, vlastitim rukama, usred korone.',
    rows:[ {voor:5, na:'nightpray', vcap:'Goli kostur', ncap:'Mesdžid u večernjem svjetlu'} ] },
  { title:'Divanhana', bos:'gemeenschapsruimte', text:'Prostor zajednice dobio je oblik: kutak za sjedenje, kuhinja, mjesto za muhabet i kafu poslije namaza. Srce gostoprimstva.',
    rows:[
      {voor:8,  na:'img/divanhana-zaal.jpg', vcap:'Goli prostor', ncap:'Divanhana danas'},
      {voor:20, na:'divanhana',               vcap:'Otvoreni kostur', ncap:'Kutak za muhabet'}
    ] },
  { title:'Podrum', bos:'kelder', text:'I podrum je uzet pod ruke — od mračnog kostura do upotrebljivog, dovršenog prostora za zajednicu.',
    rows:[ {voor:16, na:'podrum', vcap:'Mračni podrum', ncap:'Dovršeni podrum'} ] },
  { title:'Mektebske učionice', bos:'mekteb-klassen', text:'Bočni prostori postali su svijetle, tople učionice za našu djecu — sigurno mjesto da nauče ko su. Od ruševine do doma, alhamdulillah.',
    rows:[ {voor:17, na:'mekteb', vcap:'Nedovršeni prostor', ncap:'Svijetla mektebska učionica'} ] },
];

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

// gestileerde placeholder blijft zichtbaar tot de foto laadt (en als fallback)
function phLayer(fase, src, cap, num){
  const icon = fase==='voor' ? '▤' : '☾';
  const tag  = fase==='voor' ? 'Prije · voor' : 'Poslije · na';
  return `<div class="ph" data-fase="${fase}"><div class="ph-inner">
      <div class="ph-icon">${icon}</div>
      <div class="ph-tag">${tag}</div>
      <div class="ph-cap">${cap}</div>
      <div class="ph-num">${num}</div>
    </div></div>
    <img alt="${cap}" loading="lazy" referrerpolicy="no-referrer" src="${src}" onerror="this.style.display='none'">`;
}

const wrap = document.getElementById('stops');
const LOGO_SVG = `<svg viewBox="0 0 44 34" aria-hidden="true">
        <path class="hk-moon" fill-rule="evenodd" d="M4 19 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0 M11.5 14.5 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0"/>
        <path class="hk-star" d="M33 5.5 L34.29 9.22 L38.23 9.30 L35.09 11.68 L36.23 15.45 L33 13.2 L29.77 15.45 L30.91 11.68 L27.77 9.30 L31.71 9.22 Z"/>
      </svg>`;

STOPS.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'stop';
  el.setAttribute('data-screen-label', String(i+1).padStart(2,'0') + ' · ' + s.title.replace('&amp;','&'));
  const duos = s.rows.map(r => `
    <div class="duo">
      <figure class="duo-side voor">
        ${phLayer('voor', renoSrc(r.voor,1300), r.vcap, 'renovatie · '+r.voor)}
        <span class="duo-badge">Prije · voor</span>
        <figcaption class="duo-cap">${r.vcap}</figcaption>
      </figure>
      <figure class="duo-side na">
        ${phLayer('na', (String(r.na).indexOf('/')>=0 ? r.na : naSrc(r.na,1500)), r.ncap, r.ncap)}
        <span class="duo-badge">Poslije · na</span>
        <figcaption class="duo-cap">${r.ncap}</figcaption>
      </figure>
    </div>`).join('');
  el.innerHTML = `
    <div class="stop-head">
      <div class="stop-titles">
        <div class="stop-title">${s.title} <span class="bos">· ${s.bos}</span></div>
        <p class="stop-text">${s.text}</p>
      </div>
    </div>
    ${duos}`;
  wrap.appendChild(el);
});

// foto's staan altijd zichtbaar — geen verborgen begin-state,
// zodat de pagina nooit leeg/zwart opent

// Finale (de džamija)
document.getElementById('finale-photo').src = naSrc('dzamija',2000);
</script>
